name: Heartbeat Python Service

on:
  schedule:
    # Render Free sleeps after 15 minutes without inbound traffic. Avoid minute 0,
    # when scheduled GitHub Actions are more likely to be delayed.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Ping Python warmup endpoint
        env:
          PYTHON_SERVICE_URL: ${{ secrets.PYTHON_SERVICE_URL }}
          HEARTBEAT_SECRET: ${{ secrets.HEARTBEAT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$PYTHON_SERVICE_URL" ] || [ -z "$HEARTBEAT_SECRET" ]; then
            echo "PYTHON_SERVICE_URL e HEARTBEAT_SECRET precisam estar configurados."
            exit 1
          fi

          CLEAN_URL="${PYTHON_SERVICE_URL%/}"
          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --retry 1 \
            --retry-delay 5 \
            --retry-all-errors \
            --output "$RUNNER_TEMP/warmup_response.json" \
            --write-out "%{http_code}" \
            --max-time 90 \
            -H "x-heartbeat-secret: $HEARTBEAT_SECRET" \
            "${CLEAN_URL}/warmup")

          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] || ! jq -e '.status == "ok" and .earthEngineReady == true' "$RUNNER_TEMP/warmup_response.json" > /dev/null; then
            echo "O Python respondeu, mas o processamento de satélite não está pronto."
            exit 1
          fi
          echo "Python e Earth Engine prontos."
