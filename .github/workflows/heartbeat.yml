name: Heartbeat Python Service

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Python warmup endpoint
        env:
          PYTHON_SERVICE_URL: ${{ secrets.PYTHON_SERVICE_URL }}
          HEARTBEAT_SECRET: ${{ secrets.HEARTBEAT_SECRET }}
        run: |
          if [ -z "$PYTHON_SERVICE_URL" ]; then
            echo "PYTHON_SERVICE_URL secret is not configured"
            exit 1
          fi

          echo "Pinging Python warmup endpoint..."

          if [ -z "$HEARTBEAT_SECRET" ]; then
            curl --fail --show-error --silent \
              --max-time 60 \
              "$PYTHON_SERVICE_URL/warmup"
          else
            curl --fail --show-error --silent \
              --max-time 60 \
              -H "x-heartbeat-secret: $HEARTBEAT_SECRET" \
              "$PYTHON_SERVICE_URL/warmup"
          fi

          echo "Python service heartbeat completed successfully."
