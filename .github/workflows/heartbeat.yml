name: Heartbeat Python Service

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Ping Python warmup endpoint
        env:
          PYTHON_SERVICE_URL: ${{ secrets.PYTHON_SERVICE_URL }}
          HEARTBEAT_SECRET: ${{ secrets.HEARTBEAT_SECRET }}
        run: |
          # Remove trailing slash if present to avoid //warmup
          CLEAN_URL=$(echo "${PYTHON_SERVICE_URL}" | sed 's/\/$//')
          
          echo "PYTHON_SERVICE_URL configured: $(if [ -n "$PYTHON_SERVICE_URL" ]; then echo "true"; else echo "false"; fi)"
          echo "HEARTBEAT_SECRET configured: $(if [ -n "$HEARTBEAT_SECRET" ]; then echo "true"; else echo "false"; fi)"
          echo "Calling /warmup..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/warmup_response.json \
            --write-out "%{http_code}" \
            --max-time 120 \
            -H "x-heartbeat-secret: $HEARTBEAT_SECRET" \
            "${CLEAN_URL}/warmup")

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Python service heartbeat completed successfully."
            exit 0
          elif [ "$HTTP_STATUS" = "401" ]; then
            echo "erro: HEARTBEAT_SECRET está ausente ou diferente entre GitHub Actions e Render Python."
            exit 1
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "erro: PYTHON_SERVICE_URL errado ou /warmup inexistente."
            exit 1
          elif [ "$HTTP_STATUS" = "000" ]; then
            echo "erro: curl não conseguiu conectar."
            exit 1
          else
            echo "erro inesperado. Status: $HTTP_STATUS"
            exit 1
          fi
